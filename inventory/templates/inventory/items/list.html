{% extends "inventory/base.html" %}
{% block title %}Items{% endblock %}
{% block nav_items %}active{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0"><i class="bi bi-box-seam me-2"></i>Items</h1>
  <a href="{% url 'inventory:item_create' %}" class="btn btn-success">
    <i class="bi bi-plus-lg me-1"></i>Add Item
  </a>
</div>

<!-- Filters -->
<form class="row g-2 mb-3"
      hx-get="{% url 'inventory:item_list' %}"
      hx-target="#results"
      hx-trigger="change, input delay:400ms"
      hx-push-url="true">
  <div class="col-12 col-md-5">
    <input type="search" name="q" value="{{ q }}" class="form-control"
           placeholder="Search items..." autocomplete="off">
  </div>
  <div class="col-6 col-md-3">
    <select name="status" class="form-select">
      <option value="">All Statuses</option>
      {% for val, label in status_choices %}
        <option value="{{ val }}" {% if val == status %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-6 col-md-3">
    <select name="category" class="form-select">
      <option value="">All Categories</option>
      {% for cat in categories %}
        <option value="{{ cat.pk }}" {% if cat.pk|stringformat:"s" == category %}selected{% endif %}>{{ cat }}</option>
      {% endfor %}
    </select>
  </div>
</form>

<div id="results">
  {% include "inventory/items/_table.html" %}
</div>
{% endblock %}
