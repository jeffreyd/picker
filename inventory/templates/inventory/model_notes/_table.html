{% if notes %}
<div class="table-responsive">
  <table class="table table-hover align-middle">
    <thead>
      <tr>
        <th>Make</th>
        <th>Model</th>
        <th>Category</th>
        <th>Notes Preview</th>
        <th>Updated</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for note in notes %}
      <tr>
        <td class="fw-semibold">{{ note.make }}</td>
        <td><a href="{{ note.get_absolute_url }}" class="text-decoration-none fw-semibold">{{ note.model }}</a></td>
        <td class="small">{{ note.category|default:"—" }}</td>
        <td class="small text-muted">{{ note.notes|truncatechars:80 }}</td>
        <td class="small text-muted">{{ note.updated_at|date:"N j, Y" }}</td>
        <td class="text-end">
          <a href="{% url 'inventory:modelnote_edit' note.pk %}" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-pencil"></i>
          </a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% else %}
<div class="text-center text-muted py-5">
  <i class="bi bi-journal-text fs-1 d-block mb-2"></i>
  No model notes yet.
  <a href="{% url 'inventory:modelnote_create' %}">Add your first note</a>
</div>
{% endif %}
